<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0714" />

    <!-- Primary SEO (per-route values are managed dynamically via react-helmet-async) -->
    <title>Spark Labs — AI Learning Laboratory · Learn. Build. Launch.</title>
    <meta
      name="description"
      content="Spark Labs is a premium AI Learning Laboratory in Raigarh, Chhattisgarh. Students aged 13–18 learn by building 10+ real AI projects in a 6-week, in-person AI Builder Program."
    />
    <meta
      name="keywords"
      content="AI course for students, AI Builder Program, learn AI Raigarh, AI classes Chhattisgarh, coding for teenagers, prompt engineering course, project based AI learning, Spark Labs"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Charvikon Training & Research Centre" />
    <link rel="canonical" href="https://sparklabs.in/" />

    <!-- Google Search Console: replace the content value with your verification token -->
    <!-- <meta name="google-site-verification" content="YOUR_TOKEN_HERE" /> -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spark Labs" />
    <meta property="og:title" content="Spark Labs — AI Learning Laboratory · Learn. Build. Launch." />
    <meta
      property="og:description"
      content="A 6-week, project-based AI laboratory for students aged 13–18 in Raigarh. Build real AI projects. Graduate with a portfolio."
    />
    <meta property="og:url" content="https://sparklabs.in/" />
    <meta property="og:image" content="https://sparklabs.in/og-image.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spark Labs — AI Learning Laboratory" />
    <meta
      name="twitter:description"
      content="Build AI. Don't just learn about it. A 6-week project-based AI lab for students aged 13–18 in Raigarh."
    />
    <meta name="twitter:image" content="https://sparklabs.in/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%237c3aed'/%3E%3C/svg%3E"
    />

    <!-- No-flash dark mode: runs before body so the theme is applied on first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("spark-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- Base structured data (per-page schema is injected at runtime) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Spark Labs",
        "legalName": "Charvikon Training & Research Centre",
        "url": "https://sparklabs.in",
        "description": "AI Learning Laboratory transforming beginners into confident AI builders through project-based education.",
        "email": "admissions@sparklabs.in",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Raigarh",
          "addressRegion": "Chhattisgarh",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
